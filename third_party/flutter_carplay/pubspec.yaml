name: flutter_carplay
description: Flutter Apps are now on Apple CarPlay and Android Auto. This package aims to make it safe to use apps made with Flutter in the car by integrating with CarPlay or Android Auto.
version: 1.6.5
homepage: https://github.com/oguzhnatly/flutter_carplay#readme
repository: https://github.com/oguzhnatly/flutter_carplay
issue_tracker: https://github.com/oguzhnatly/flutter_carplay/issues

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=1.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # DELTA A from upstream 1.6.5: the `ios:` entry and the whole ios/
      # directory are removed. MeshMapper uses this package for Android Auto
      # only. Left in place, it would link SwiftFlutterCarplayPlugin into the
      # App Store build — a CarPlay scene-delegate and entitlement surface we
      # do not want and cannot ship without Apple's CarPlay entitlement.
      # The Dart AA* classes are pure Dart plus a MethodChannel and still
      # compile on iOS, where AndroidAutoService.isSupportedPlatform is false.
      android:
        package: com.oguzhnatly.flutter_android_auto
        pluginClass: FlutterAndroidAutoPlugin
