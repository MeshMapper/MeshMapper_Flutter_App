name: mesh_mapper
description: MeshMapper - Cross-platform wardriving app for MeshCore devices
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.32.0
  flutter_web_bluetooth: ^0.2.3
  geolocator: ^11.0.0
  maplibre_gl: ^0.25.0
  clock: ^1.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.0
  permission_handler: ^11.3.0
  uuid: ^4.3.0
  pointycastle: ^4.0.0
  intl: ^0.19.0
  crypto: ^3.0.7
  wakelock_plus: ^1.4.0
  share_plus: ^12.0.1
  path_provider: ^2.1.0
  xml: ^6.5.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.0
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.0.0
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  dio: ^5.0.0
  font_awesome_flutter: ^11.0.0
  fl_chart: ^0.69.0
  web: ^1.1.0
  disk_space_plus: ^0.2.3
  # Custom-scheme deep links for the MyMeshMapper portal sign-in callback
  # (meshmapper-auth://callback). uni_links was rejected — unmaintained.
  app_links: ^6.3.0
  # Keychain / Android Keystore storage for the portal app token
  flutter_secure_storage: ^9.2.0
  flutter_carplay: ^1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.3

# Vendored, patched copy of maplibre_gl 0.25.0. The ONLY delta from the
# upstream pub.dev release is a native guard in the camera handlers
# (ios/.../MapLibreMapController.swift + android/.../MapLibreMapController.java)
# that refuses camera moves while the map view has no usable viewport —
# MapLibre's transform unprojects against the viewport and aborts the app with
# an uncaught C++ std::domain_error (SIGABRT) when it is degenerate/zero-sized.
# That throw cannot be caught from Dart, so the fix must live in the plugin.
# Re-apply the guard when bumping maplibre_gl. See DEVELOPMENT.md.
# Vendored, patched copy of flutter_carplay 1.6.5, used for its Android Auto
# half only. Three deltas from the upstream pub.dev release, all marked "DELTA"
# in the vendored source:
#   A. The `ios:` plugin platform entry and the ios/ directory are removed.
#      MeshMapper ships on the App Store; upstream would link
#      SwiftFlutterCarplayPlugin into Runner for a CarPlay surface we neither
#      want nor hold Apple's entitlement for.
#   B. AndroidAutoService gains FAAEngineProvider, so the app can supply the
#      engine. Upstream builds a bare headless one when the cache is empty,
#      which in this app is the wrong engine — ours owns the USB serial and
#      tile cache channels (see MeshMapperEngine.kt).
#   C. createHostValidator no longer returns ALLOW_ALL_HOSTS_VALIDATOR in
#      release builds; that is debug-only per Android's docs and lets any app
#      on the device drive the car surface.
# example/, previews/ and test/ are not vendored. Re-apply all three deltas when
# bumping flutter_carplay. See DEVELOPMENT.md.
dependency_overrides:
  maplibre_gl:
    path: third_party/maplibre_gl
  flutter_carplay:
    path: third_party/flutter_carplay

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/wardrive.png"
  image_path_ios: "assets/wardrive_ios.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/wardrive.png"

flutter:
  uses-material-design: true
  assets:
    - assets/device-models.json
    - assets/wardrive.png
    - assets/transmitted_packet.mp3
    - assets/received_packet.mp3
    # Android Auto map action strip icons. The strip is icon-only —
    # ACTIONS_CONSTRAINTS_MAP leaves maxCustomTitles at 0 — so these are not
    # decoration, they are the buttons. White on transparent so the host tints
    # them to its own theme.
    - assets/car_start.png
    - assets/car_stop.png
